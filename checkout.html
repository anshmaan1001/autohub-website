<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry checkout | AUTOHUB</title><link rel="stylesheet" href="css/store.css"></head><body><div id="site-header"></div><main class="wrap"><form class="formpanel" id="checkout-form"><div class="kicker">Almost there</div><h2>Request your vehicle enquiry</h2><p style="color:var(--muted);font-size:13px">Share your contact details. A real dealership integration is not connected in this demo.</p><div class="notice"><span id="checkout-items"></span><br>Estimated selection value: <b id="checkout-total"></b></div><div class="formgrid"><div class="field"><label>Full name</label><input name="name" required autocomplete="name"></div><div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Phone number</label><input name="phone" type="tel" required pattern="[0-9+ -]{8,16}"></div><div class="field"><label>City</label><input name="city" required autocomplete="address-level2"></div></div><button class="btnx wide" type="submit">Submit enquiry</button><p style="font-size:11px;color:var(--muted)">No payment details are requested. This demo stores the enquiry only in your browser.</p></form><div id="checkout-result" class="formpanel"></div></main><div id="site-footer"></div><script src="js/store.js"></script></body></html>
